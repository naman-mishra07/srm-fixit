<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#AFCDE0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SRM-FixIt">
<title>SRM-FixIt — Staff Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

<h1>Admin / Maintenance Team</h1>
<p class="subtitle">Confirm your SRM Academia password to continue to the staff dashboard.</p>

<div class="card">
  <label for="staffEmail">SRM email</label>
  <input type="email" id="staffEmail" autocomplete="username" readonly>

  <label for="staffPassword">SRM Academia password</label>
  <input type="password" id="staffPassword" autocomplete="current-password">

  <button id="staffLoginBtn">Continue</button>
  <div id="staffLoginMsg" aria-live="polite"></div>
  <button id="optionsPathBtn" class="secondary">Back to options</button>
  <button id="studentPathBtn" class="secondary">Go to Student / Faculty</button>
</div>

<script src="supabase-client.js"></script>
<script src="pwa-install.js"></script>
<script>
let currentSession = null;

async function init() {
  currentSession = await requireAuth();
  if (!currentSession) return;
  document.getElementById("staffEmail").value = currentSession.user.email || "";
}

document.getElementById("staffLoginBtn").addEventListener("click", async () => {
  const password = document.getElementById("staffPassword").value;
  const message = document.getElementById("staffLoginMsg");
  message.textContent = "";

  if (!currentSession) {
    window.location.href = "index.html";
    return;
  }
  if (!password) {
    message.textContent = "Enter your password to continue.";
    message.className = "error";
    return;
  }

  const button = document.getElementById("staffLoginBtn");
  button.disabled = true;
  button.textContent = "Verifying with SRM...";
  let data;
  let authenticated = false;
  try {
    const result = await requestSrmAuthToken(currentSession.user.email, password);
    const verified = await supabaseClient.auth.verifyOtp({ token_hash: result.tokenHash, type: "magiclink" });
    if (verified.error || verified.data.user?.id !== currentSession.user.id) {
      throw new Error("Could not verify this FixIt account. Sign out and sign in with the matching SRM account.");
    }
    authenticated = true;
    data = verified.data;
  } catch (error) {
    showSrmAuthError(message, error);
    button.disabled = false;
    button.textContent = "Continue";
    return;
  } finally {
    if (authenticated) document.getElementById("staffPassword").value = "";
    button.disabled = false;
    button.textContent = "Continue";
  }

  const profile = await getMyProfile(currentSession.user.id);
  if (profile?.role === "developer") {
    sessionStorage.setItem("srmFixitDeveloperReauth", currentSession.user.id);
    window.location.href = "admin.html";
    return;
  }
  if (profile?.role !== "admin") {
    message.textContent = "This SRM account is not enabled for the admin/maintenance team.";
    message.className = "error";
    return;
  }
  sessionStorage.setItem("srmFixitStaffReauth", currentSession.user.id);
  window.location.href = "admin.html";
});

document.getElementById("studentPathBtn").addEventListener("click", () => {
  window.location.href = "student.html";
});

document.getElementById("optionsPathBtn").addEventListener("click", () => {
  window.location.href = "index.html";
});

init();
</script>

</body>
</html>
