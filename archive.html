<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#AFCDE0"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml"><title>SRM-FixIt — Resolved Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--white:#F6F1E7;--blue:#AFCDE0;--yellow:#F3D77B;--red:#C73532;--paper:#FCFAF5;--ink:#22262f;--muted:#6a6963;--line:#E3DBC9;--blue-soft:#E3EEF5;--blue-deep:#2f5f80;--radius:14px;--font:"Barlow",system-ui,sans-serif;--display:"Bebas Neue",Impact,sans-serif;--shadow:0 1px 0 rgba(34,38,47,.04),0 6px 18px -10px rgba(34,38,47,.22)}
*{box-sizing:border-box}body{margin:0 auto;max-width:1080px;padding:20px;background:var(--white);color:var(--ink);font:400 16px/1.5 var(--font)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--blue);margin:-20px -20px 22px;padding:20px;border-radius:0 0 22px 22px}.top h1{font:400 42px/1 var(--display);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 18px;background:var(--yellow);color:var(--ink);cursor:pointer}.secondary{background:rgba(252,250,245,.55);box-shadow:inset 0 0 0 1px rgba(34,38,47,.25)}
.intro{color:var(--muted);margin:0 0 18px}.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1;font:inherit;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:10px 15px;color:var(--ink)}
.count{font-weight:700;margin:0 0 12px}.list{display:grid;gap:14px}.ticket{display:flex;gap:16px;padding:15px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:var(--radius);box-shadow:var(--shadow)}.ticket>img{width:112px;height:112px;object-fit:cover;border-radius:10px;background:var(--line);flex:none}.body{min-width:0;flex:1}.title{font:400 28px/1 var(--display);letter-spacing:.03em}.badge{display:inline-block;background:var(--blue);border-radius:99px;padding:2px 11px;margin-left:8px;font-size:13px;font-weight:700;vertical-align:5px}.meta{color:var(--muted);font-size:15px;overflow-wrap:anywhere}.note{margin-top:9px;padding:10px 12px;background:var(--blue-soft);border-radius:10px;white-space:pre-wrap}.note b{display:block}.evidence{display:block;color:var(--blue-deep);font-weight:700;margin-top:5px}.mail{display:inline-block;margin-top:8px;color:var(--blue-deep);font-weight:700}.empty,.error{color:var(--muted)}.error{color:var(--red)}
@media(max-width:560px){body{padding:14px}.top{margin:-14px -14px 18px;padding:16px 14px;align-items:flex-start;flex-direction:column}.top h1{font-size:36px}.ticket{gap:11px;padding:11px}.ticket>img{width:78px;height:78px}.title{font-size:24px}}
</style></head>
<body>
<header class="top"><h1>Resolved Archive</h1><div class="actions"><button class="secondary" onclick="location.href='admin.html'">Back to dashboard</button><button class="secondary" onclick="logout()">Log Out</button></div></header>
<p class="intro">Resolved tickets are kept here, separate from the active dashboard.</p>
<div class="tools"><input id="search" type="search" placeholder="Search category, location, reporter, or description" aria-label="Search resolved tickets"></div>
<p id="count" class="count"></p><main id="list" class="list" aria-live="polite"><p class="empty">Loading resolved tickets…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
<script>
const $=s=>document.querySelector(s),C={wifi:"WiFi",furniture:"Furniture",ac:"AC",electrical:"Electrical",smartboards_mics:"Smartboards & Mics",plumbing:"Plumbing",cleaning:"Cleaning"};
const esc=x=>String(x??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tickets=[],profiles=new Map(),resolutions=[],urls=new Map();
function date(x){return new Date(x).toLocaleString([],{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}
function place(t){return `${t.building||"Building not set"}, ${t.floor||"Floor not set"}${t.is_common_area?" (Common Area)":`, Room ${t.room_number||"—"}`}`}
function safePhoto(value){try{const u=new URL(value),host=new URL(SUPABASE_URL).host;return u.protocol==="https:"&&u.host===host&&u.pathname.includes("/storage/v1/object/public/ticket-photos/")?u.href:""}catch{return ""}}
function render(){const q=$("#search").value.trim().toLowerCase(),rows=tickets.filter(t=>[t.description,t.building,t.floor,t.room_number,profiles.get(t.student_id)?.full_name,C[t.category]||t.category].join(" ").toLowerCase().includes(q));$("#count").textContent=`${rows.length} resolved ticket${rows.length===1?"":"s"}`;$("#list").innerHTML=rows.length?rows.map(t=>{const p=profiles.get(t.student_id),ev=resolutions.find(x=>x.ticket_id===t.id&&x.event_type==="submitted"),confirmation=resolutions.find(x=>x.ticket_id===t.id&&x.event_type==="confirmed"),photo=safePhoto(t.photo_url);const subject="SRM-FixIt: Your maintenance issue has been resolved",body=`Hello ${p?.full_name||"there"},\n\nYour ${C[t.category]||t.category} issue at ${place(t)} has been resolved.\n\nRegards,\nSRM-FixIt Maintenance Team`;const mail=p?.college_email?`<a class="mail" href="mailto:${encodeURIComponent(p.college_email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}">Draft resolution email to ${esc(p.college_email)}</a>`:"";return `<article class="ticket">${photo?`<img src="${esc(photo)}" alt="Reported issue photo" loading="lazy">`:""}<div class="body"><div><strong class="title">${esc(C[t.category]||t.category)}</strong><span class="badge">Resolved</span></div><div class="meta">${esc(place(t))}</div><div class="meta">Reported by ${esc(p?.full_name||"Unknown")}${p?.registration_number?` · Reg. no. ${esc(p.registration_number)}`:""}</div><div class="meta">Submitted ${date(t.created_at)}${confirmation?` · Confirmed ${date(confirmation.created_at)}`:""}</div>${t.description?`<div class="meta">${esc(t.description)}</div>`:""}${ev?`<div class="note"><b>Staff completion note</b>${esc(ev.resolution_note||"")}${ev.evidence_path&&urls.has(ev.evidence_path)?`<a class="evidence" href="${esc(urls.get(ev.evidence_path))}" target="_blank" rel="noopener">View private after photo</a>`:""}</div>`:""}${mail}</div></article>`}).join(""):`<p class="empty">${tickets.length?"No resolved tickets match your search.":"No resolved tickets yet."}</p>`}
async function init(){const session=await requireAuth();if(!session)return;const profile=await getMyProfile(session.user.id);if(!profile||!["admin","developer"].includes(profile.role)){location.href="student.html";return}if(profile.role==="admin"&&sessionStorage.getItem("srmFixitStaffReauth")!==session.user.id){location.href="staff-login.html";return}
 const [t,p,r]=await Promise.all([supabaseClient.from("tickets").select("*").eq("status","resolved").order("created_at",{ascending:false}),supabaseClient.from("profiles").select("id,full_name,college_email,registration_number"),supabaseClient.from("ticket_resolution_events").select("id,ticket_id,event_type,resolution_note,evidence_path,created_at").order("created_at",{ascending:false}).limit(1000)]);
 if(t.error){$("#list").innerHTML=`<p class="error">Could not load resolved tickets: ${esc(t.error.message)}</p>`;return}tickets=t.data||[];profiles=new Map((p.data||[]).map(x=>[x.id,x]));resolutions=r.data||[];if(r.error)console.warn("Resolution archive details unavailable:",r.error.message);await Promise.all([...new Set(resolutions.map(x=>x.evidence_path).filter(Boolean))].map(async path=>{const {data}=await supabaseClient.storage.from("ticket-resolution-evidence").createSignedUrl(path,300);if(data?.signedUrl)urls.set(path,data.signedUrl)}));render()}
$("#search").addEventListener("input",render);init();
</script></body></html>
